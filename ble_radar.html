<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RadarLink BLE</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 15%,#103152,#020813 68%);color:#e2f7ff;min-height:100vh}main{max-width:820px;margin:auto;padding:18px}header{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{margin:0;color:#00eaff;letter-spacing:.17em;font-size:clamp(20px,4vw,30px);text-shadow:0 0 20px #00bfff}button{background:#083c56;border:1px solid #00cfee;color:white;padding:10px 14px;border-radius:8px;cursor:pointer}button:disabled{opacity:.45}#status{color:#95afc0;margin:13px 0}.warning{display:flex;gap:8px}.lamp{flex:1;text-align:center;background:#0a1b2b;border:1px solid #30495c;border-radius:10px;padding:16px 3px;font-weight:700;font-size:clamp(15px,3vw,25px);color:#819bad;transition:.12s}.lamp.on{color:white;background:#a80e36;border-color:#ff4f71;box-shadow:0 0 25px #d52256,inset 0 0 18px #ff5465;animation:pulse .55s infinite alternate}@keyframes pulse{to{filter:brightness(1.45)}}canvas{width:100%;height:min(70vw,550px);display:block}#targets{min-height:35px;color:#b5dbeb;text-align:center}details{border:1px solid #2c536c;background:#071626;border-radius:9px;padding:15px;margin-top:16px}summary{color:#00deef;font-weight:bold;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px;margin:13px 0}label{display:flex;flex-direction:column;gap:5px;color:#9fc7d9;font-size:13px}input{background:#0d2a41;color:white;border:1px solid #386984;border-radius:6px;padding:8px;font-size:16px}.hint{font-size:12px;color:#8eaabc;line-height:1.5}
</style>
<main><header><h1>REAR RADAR // BLE</h1><button id="connect">连接雷达</button></header><div id="status">未连接。手机保持原有移动网络，点击“连接雷达”。</div><div class="warning"><div id="left" class="lamp">左侧</div><div id="center" class="lamp">正后方</div><div id="right" class="lamp">右侧</div></div><canvas id="radar"></canvas><div id="targets">等待数据</div><details><summary>警示与雷达参数</summary><p class="hint">“读取”显示 ESP32 上次保存的参数；“保存”下发到雷达并写模块 Flash。当前版本未校验模块 ACK，请断电重启后用官方上位机核验关键参数。</p><h3>灯光策略</h3><div id="local" class="grid"></div><button id="saveLocal">保存灯光参数</button><h3>模块检测参数</h3><div id="module" class="grid"></div><button id="saveModule">保存模块参数</button></details></main>
<script>
const S='4d5a1000-6653-4f80-8d40-7aef52b2026a',N='4d5a1001-6653-4f80-8d40-7aef52b2026a',C='4d5a1002-6653-4f80-8d40-7aef52b2026a';
const local=[['far','开始预警距离 m',1,30,6],['solid','常亮距离 m',1,30,1],['speed','最低触发速度 m/s',0,30,0],['center','正后方角度 ±°',0,45,10]];
const module=[['d1','雷达开关',0,1,1],['level','距离等级',0,15,15],['d2','运动最远距离 cm',0,3000,600],['d4','运动最近距离 cm',0,3000,0],['d5','运动灵敏度',0,10,6],['d6','微动最远距离 cm',0,3000,600],['d7','微动最近距离 cm',0,3000,0],['d8','微动灵敏度',0,10,5],['d9','存在最远距离 cm',0,3000,600],['da','存在最近距离 cm',0,3000,0],['db','存在灵敏度',0,10,5],['outtime','OUT 保持时间 s',0,3600,1],['lux','照度阈值',0,65535,0],['out','OUT 有效',0,1,1],['pwm','PWM 占空比 0.1%',0,1000,500],['ulp','低功耗活跃时间 s',0,255,10]];
for(const [id,items] of [['local',local],['module',module]])document.getElementById(id).innerHTML=items.map(([key,name,min,max,value])=>`<label>${name}<input id="${key}" type="number" min="${min}" max="${max}" value="${value}"></label>`).join('');
const status=document.getElementById('status'),canvas=document.getElementById('radar'),ctx=canvas.getContext('2d');let device,notify,command,targets=[],last=0,frame=-1,received=[];
function state(text){status.textContent=text}function indicators(){for(const [id,bit] of [['left',1],['center',4],['right',2]])document.getElementById(id).classList.toggle('on',targets.some(t=>t[4]===bit));document.getElementById('targets').textContent=targets.length+' 个目标 · '+targets.map(t=>'#'+t[0]+' '+t[1]+'m '+t[2]+'° '+t[3]+'m/s').join('  ')}
function onReport(e){const d=e.target.value;if(d.byteLength<8)return;const seq=d.getUint8(0),index=d.getUint8(1),count=d.getUint8(2);if(seq!==frame){frame=seq;received=[]}if(count===0){targets=[];last=performance.now();indicators();return}received[index]=[d.getInt8(3),d.getInt8(4),d.getInt8(5),d.getInt8(6),d.getUint8(7)];if(received.filter(Boolean).length===count){targets=received.slice(0,count);last=performance.now();indicators()}}
async function send(text){if(!command)throw Error('蓝牙未连接');await command.writeValueWithResponse(new TextEncoder().encode(text));return new TextDecoder().decode(await command.readValue())}
async function readSettings(){for(const [key] of [...local,...module]){const reply=await send('get:'+key);const [name,value]=reply.split('=');if(name===key)document.getElementById(key).value=value}state('已连接 · 参数已读取')}
document.getElementById('connect').onclick=async()=>{try{if(!navigator.bluetooth)throw Error('此浏览器不支持 Web Bluetooth；请用 Android Chrome 的 HTTPS 页面');device=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'RadarLink-BLE'}],optionalServices:[S]});device.addEventListener('gattserverdisconnected',()=>{notify=command=null;targets=[];indicators();state('蓝牙已断开，请重新连接')});const server=await device.gatt.connect(),service=await server.getPrimaryService(S);notify=await service.getCharacteristic(N);command=await service.getCharacteristic(C);notify.addEventListener('characteristicvaluechanged',onReport);await notify.startNotifications();state('蓝牙已连接 · 正在读取参数');await readSettings()}catch(e){state('连接失败：'+e.message)}};
async function save(items,flash){try{for(const [key,,min,max] of items){const input=document.getElementById(key),v=Number(input.value);if(!Number.isInteger(v)||v<min||v>max)throw Error(key+' 参数超出范围');const reply=await send('set:'+key+':'+v);if(!reply.startsWith('OK:'))throw Error(key+' 写入失败');if(flash)await new Promise(done=>setTimeout(done,100))}if(flash){const reply=await send('save');if(reply!=='OK:save')throw Error('Flash 保存指令失败')}state('已发送并保存到 ESP32；模块 ACK 尚未核验')}catch(e){state('保存失败：'+e.message)}}
document.getElementById('saveLocal').onclick=()=>save(local,false);document.getElementById('saveModule').onclick=()=>save(module,true);
function draw(t){requestAnimationFrame(draw);const scale=devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==Math.round(w*scale)||canvas.height!==Math.round(h*scale)){canvas.width=w*scale;canvas.height=h*scale}const W=canvas.width,H=canvas.height,R=Math.min(W*.47,H*.82),cx=W/2,cy=H*.12;ctx.fillStyle='#04101f';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#205575';ctx.lineWidth=scale;for(let n=1;n<=4;n++){ctx.beginPath();ctx.arc(cx,cy,R*n/4,0,Math.PI);ctx.stroke()}ctx.beginPath();ctx.moveTo(cx-R,cy);ctx.lineTo(cx+R,cy);ctx.stroke();const a=Math.sin(t/850)*Math.PI*.47;ctx.strokeStyle='#00eaff';ctx.shadowColor='#00dfff';ctx.shadowBlur=15*scale;ctx.lineWidth=3*scale;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.sin(a)*R,cy+Math.cos(a)*R);ctx.stroke();ctx.shadowBlur=0;if(t-last>1600){if(targets.length){targets=[];indicators()}return}for(const [id,range,angle,velocity,sides] of targets){const radius=Math.min(Math.max(range,0),30)*R/30,b=angle*Math.PI/180,px=cx+Math.sin(b)*radius,py=cy+Math.cos(b)*radius;ctx.fillStyle=sides?'#ff4b72':'#52ffab';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=17*scale;ctx.beginPath();ctx.arc(px,py,7*scale,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.font=`${12*scale}px sans-serif`;ctx.fillText('#'+id+' '+range+'m',px+9*scale,py+4*scale)}}requestAnimationFrame(draw);
</script></html>
